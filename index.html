<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoiler ReSilence SMP</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}

body{
  font-family:"Press Start 2P","Courier New",monospace;
  color:white;
  background:radial-gradient(1200px 600px at 50% 120%, #4b1c7a 0%, #243c9f 40%, #070a1a 70%, #02040d 100%);
}

/* ===== STARS ===== */
#stars{position:fixed;inset:0;z-index:-1}

/* ===== TOP TITLE ===== */
.header{
  position:absolute;
  top:30px;
  width:100%;
  text-align:center;
}
.header h1{
  font-size:20px;
  letter-spacing:3px;
  text-shadow:0 0 10px #c29bff,0 0 25px #6b7cff;
}
.header h2{
  font-size:11px;
  margin-top:8px;
  color:#d6dcff;
}

/* ===== CENTER CARD ===== */
.card{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(15,15,40,.55);
  padding:26px 28px;
  border-radius:18px;
  text-align:center;
  backdrop-filter:blur(6px);
  box-shadow:0 0 35px rgba(140,140,255,.35);
}

/* BUTTON */
.btn{
  padding:14px 22px;
  font-size:12px;
  border-radius:12px;
  border:1px solid rgba(180,160,255,.6);
  background:linear-gradient(90deg,#7a4bff,#4f7cff);
  color:white;
  cursor:pointer;
  box-shadow:0 0 20px rgba(140,160,255,.8);
}

/* ===== LOADING ===== */
.loading{display:none;margin-top:20px}
.percent{font-size:10px;margin-bottom:10px}
.bar{
  width:260px;
  height:14px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  box-shadow:inset 0 0 10px black;
}
.progress{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#c29bff,#6b7cff,#c29bff);
  box-shadow:0 0 15px rgba(170,190,255,.9);
}
.note{
  margin-top:10px;
  font-size:9px;
  opacity:.8;
}

/* ===== FOOTER ===== */
.footer{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
  font-size:9px;
  opacity:.6;
}

/* ===== JUMPSCARE ===== */
.jumpscare{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  z-index:9999;
  animation:shake .15s infinite;
}
.jumpscare img{
  width:100%;
  height:100%;
  object-fit:cover;
}
@keyframes shake{
  0%{transform:translate(0,0)}
  25%{transform:translate(2px,-2px)}
  50%{transform:translate(-2px,2px)}
  75%{transform:translate(2px,2px)}
  100%{transform:translate(0,0)}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="header">
  <h1>SPOILER</h1>
  <h2>ReSilence SMP</h2>
</div>

<div class="card">
  <button class="btn" id="startBtn">Lihat Spoiler</button>

  <div class="loading" id="loading">
    <div class="percent" id="percent">0%</div>
    <div class="bar"><div class="progress" id="progress"></div></div>
    <div class="note">
      Sehabis loading penuh langsung diarahkan ke web utama
    </div>
  </div>
</div>

<div class="footer">
  Kalau gameplay nya jadi kurang menarik jangan salahin admin
</div>

<div class="jumpscare" id="jumpscare">
  <img src="jumpscare.png">
</div>

<audio id="sound" src="jumpscare.mp3"></audio>

<script>
/* ===== FULLSCREEN ===== */
function goFullscreen(){
  const d=document.documentElement;
  if(d.requestFullscreen) d.requestFullscreen().catch(()=>{});
}

/* ===== STARS ===== */
const c=document.getElementById("stars"),ctx=c.getContext("2d");
let w,h,stars=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
window.onresize=resize;resize();
for(let i=0;i<120;i++)stars.push({x:Math.random()*w,y:Math.random()*h,v:2+Math.random()*3});
function draw(){
  ctx.clearRect(0,0,w,h);
  stars.forEach(s=>{
    ctx.fillStyle="rgba(255,255,255,.8)";
    ctx.fillRect(s.x,s.y,2,2);
    s.x-=s.v; s.y+=s.v;
    if(s.y>h||s.x<0){s.x=Math.random()*w;s.y=0;}
  });
  requestAnimationFrame(draw);
}
draw();

/* ===== FLOW ===== */
const btn=document.getElementById("startBtn");
const loading=document.getElementById("loading");
const bar=document.getElementById("progress");
const percent=document.getElementById("percent");

btn.onclick=()=>{
  goFullscreen();
  btn.style.display="none";
  loading.style.display="block";

  let p=0;
  const interval=setInterval(()=>{
    p++;
    bar.style.width=p+"%";
    percent.textContent=p+"%";
    if(p>=100){
      clearInterval(interval);
      triggerJumpscare();
    }
  },30);
};

function triggerJumpscare(){
  const sound=document.getElementById("sound");
  const js=document.getElementById("jumpscare");

  sound.volume=1;
  sound.play();

  setTimeout(()=>{
    js.style.display="block";
  },300);
}
</script>

</body>
</html>
